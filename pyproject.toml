[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stella"
dynamic = ["version"]
description = "Stella - personal AI secretary"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "requests>=2.33.0",
    "urllib3>=2.8.0",
]

[tool.ruff]
target-version = "py310"

[tool.pytest.ini_options]
# Reference checkouts are documentation, not Stella build or test inputs.
testpaths = ["tests"]

[project.scripts]
stella = "cli.cli:main"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
include = ["cli*"]
