- insert:
    - id: agent-hub-spawn
      name: '@deepseek-ai/dsh-subagent-spawn-in-process'
      config:
        providerName: agent-hub-spawn
    - id: agent-hub
      name: '@stella/agent-hub'
    - id: preset-agent-hub-developer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: agent-hub-developer
        name: 开发助手
        description: AgentHub 开发协作的独立执行会话。
        order: 80
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你是开发协作助手。完成当前用户交办的开发、调研或审查任务，说明实际结果与未完成事项。
              complete: true
              includeRuntimeContext: false
