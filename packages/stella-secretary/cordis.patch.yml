# Profile-owned UI extensions leave the signed official application unchanged.
- id: ui-layout
  disabled: true
- id: ui-workspace
  disabled: true
- id: ui-settings-general
  disabled: true
- id: ui-schedule
  disabled: true
- id: ui-settings-models
  disabled: true
- insert:
    - id: stella-ui-layout
      name: './vendor/ui-layout/lib/index.js'
    - id: stella-ui-workspace
      name: './vendor/ui-workspace/lib/index.js'
    - id: stella-ui-settings-general
      name: './vendor/ui-settings-general/lib/index.js'
    - id: stella-ui-schedule
      name: './vendor/ui-schedule/lib/index.js'
    - id: stella-ui-settings-models
      name: './vendor/ui-settings-models/lib/index.js'
- insert:
    - id: stella-spawn
      name: '@deepseek-ai/dsh-subagent-spawn-in-process'
      config:
        providerName: stella-spawn
    - id: stella-organizer
      name: '@stella/secretary/organizer'
    - id: stella-secretary
      name: '@stella/secretary'
    - id: preset-stella
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: stella
        name: Stella
        description: 帮你梳理想法、优先事项与安排。
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: '{{stella_identity}}'
              complete: true
              includeRuntimeContext: false
          - id: stella-tools
            name: '@stella/secretary/tools'
