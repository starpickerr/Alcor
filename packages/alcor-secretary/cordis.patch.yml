# Use official client modules; keep the application and its updater unchanged.
- insert:
    - id: alcor-organizer
      name: '@alcor/secretary/organizer'
    - id: alcor-secretary
      name: '@alcor/secretary'
    - id: alcor-tools
      name: '@alcor/secretary/tools'
    - id: preset-alcor
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: alcor
        name: Alcor
        description: 帮你梳理想法、优先事项与安排。
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: '{{alcor_identity}}'
              complete: true
              includeRuntimeContext: false
          - id: alcor-workspace-reader
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: alcor-workspace-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: alcor-workspace-shell
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: alcor-workspace-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: alcor-workspace-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: alcor-skill-reader
            name: '@deepseek-ai/dsh-tool-skill'
    - id: preset-alcor-briefing
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: alcor-briefing
        name: 简报执行
        description: Alcor 简报任务的专用执行会话。
        order: 100
        plugins:
          - id: briefing-agent
            name: '@alcor/secretary/briefing-agent'
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: '{{briefing_identity}}'
              complete: true
              includeRuntimeContext: false
    - id: preset-stella
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: stella
        name: Alcor 历史会话（兼容）
        description: 帮你梳理想法、优先事项与安排。
        order: 1000
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: '{{alcor_identity}}'
              complete: true
              includeRuntimeContext: false
          - id: stella-workspace-reader
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: stella-workspace-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: stella-workspace-shell
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: stella-workspace-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: stella-workspace-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: stella-skill-reader
            name: '@deepseek-ai/dsh-tool-skill'
    - id: preset-stella-briefing
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: stella-briefing
        name: 简报执行（旧会话兼容）
        description: Alcor 简报任务的专用执行会话。
        order: 1100
        plugins:
          - id: briefing-agent
            name: '@alcor/secretary/briefing-agent'
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: '{{briefing_identity}}'
              complete: true
              includeRuntimeContext: false
