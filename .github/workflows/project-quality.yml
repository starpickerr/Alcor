name: Legacy runtime maintenance

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'agent/**'
      - 'application/**'
      - 'bridge/**'
      - 'channel/**'
      - 'cli/**'
      - 'common/**'
      - 'core/**'
      - 'desktop/**'
      - 'models/**'
      - 'translate/**'
      - 'voice/**'
      - 'tests/**'
      - 'evals/**'
      - 'stella-plugins-workspace/**'
      - 'scripts/*.py'
      - 'resources/default-plugins.json'
      - 'resources/mcp-providers.json'
      - 'resources/legacy-sources.lock.json'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'app.py'
      - 'config.py'
      - 'Makefile'
      - '.github/workflows/project-quality.yml'
  push:
    branches: [develop, main]
    paths:
      - 'agent/**'
      - 'application/**'
      - 'bridge/**'
      - 'channel/**'
      - 'cli/**'
      - 'common/**'
      - 'core/**'
      - 'desktop/**'
      - 'models/**'
      - 'translate/**'
      - 'voice/**'
      - 'tests/**'
      - 'evals/**'
      - 'stella-plugins-workspace/**'
      - 'scripts/*.py'
      - 'resources/default-plugins.json'
      - 'resources/mcp-providers.json'
      - 'resources/legacy-sources.lock.json'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'app.py'
      - 'config.py'
      - 'Makefile'
      - '.github/workflows/project-quality.yml'
  workflow_dispatch:
    inputs:
      full_legacy_audit:
        description: Run the complete retained Python/Electron audit and evals
        type: boolean
        default: true
  schedule:
    - cron: '17 3 * * 1'

jobs:
  full-quality:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_legacy_audit)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      STELLA_PYTHON: python
    defaults:
      run:
        working-directory: Alcor
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: Alcor
      - name: Read fixed Legacy companion revisions
        id: sources
        run: python scripts/check_legacy_sources.py --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.sources.outputs.plugins_repository }}
          ref: ${{ steps.sources.outputs.plugins_revision }}
          path: Stella-Plugins
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.sources.outputs.email_repository }}
          ref: ${{ steps.sources.outputs.email_revision }}
          path: MCP/email-mcp
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.sources.outputs.elearning_repository }}
          ref: ${{ steps.sources.outputs.elearning_revision }}
          path: MCP/fudan-elearning-mcp
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Alcor/desktop/package-lock.json
      - name: Verify Legacy companion commits and source digests
        run: python scripts/check_legacy_sources.py
      - name: Install project dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npm --prefix desktop ci
          python -m playwright install --with-deps chromium
      - name: Prepare hash-verified public dependency artifacts in disposable state
        run: |
          python scripts/run_isolated.py python -m tests.fixtures.runtime_artifacts "$RUNNER_TEMP/alcor-public-artifacts"
          echo "STELLA_TEST_RUNTIME_ARTIFACTS=$RUNNER_TEMP/alcor-public-artifacts" >> "$GITHUB_ENV"
      - name: Run the complete scheduled or manually requested Legacy audit
        run: make audit-legacy
      - name: Run Stella product agent evals
        run: make eval
      - name: Preserve quality evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stella-quality-report
          path: |
            Alcor/.agents/audits/code-review/Full-Audit-*.md
            Alcor/evals/reports/latest.json
          if-no-files-found: ignore
  linux-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STELLA_PYTHON: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Linux boundary test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor-profiles
          sudo install -m 644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser --replace /etc/apparmor.d/bwrap-userns-restrict
          bwrap --die-with-parent --ro-bind / / --proc /proc --dev-bind /dev /dev -- /bin/true
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify actual Linux process, authorization and network boundaries
        run: python scripts/run_isolated.py python -m pytest tests/test_process_sandbox.py tests/test_security_gateway.py tests/test_controlled_http.py tests/test_runtime_artifacts.py tests/test_security_ssrf_web_fetch.py tests/test_security_ssrf_path_traversal.py tests/test_python_environment.py tests/test_extension_sandbox.py::test_extension_can_read_system_timezones_without_owner_access -q
