name: Legacy runtime quality

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  full-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      STELLA_PYTHON: python
    defaults:
      run:
        working-directory: Alcor
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: Alcor
      - name: Read fixed Legacy companion revisions
        id: sources
        run: python scripts/check_legacy_sources.py --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.sources.outputs.plugins_repository }}
          ref: ${{ steps.sources.outputs.plugins_revision }}
          path: Stella-Plugins
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.sources.outputs.email_repository }}
          ref: ${{ steps.sources.outputs.email_revision }}
          path: MCP/email-mcp
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.sources.outputs.elearning_repository }}
          ref: ${{ steps.sources.outputs.elearning_revision }}
          path: MCP/fudan-elearning-mcp
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Alcor/desktop/package-lock.json
      - name: Verify Legacy companion commits and source digests
        run: python scripts/check_legacy_sources.py
      - name: Install project dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor-profiles
          sudo install -m 644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser --replace /etc/apparmor.d/bwrap-userns-restrict
          bwrap --die-with-parent --ro-bind / / --proc /proc --dev-bind /dev /dev -- /bin/true
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npm --prefix desktop ci
          python -m playwright install --with-deps chromium
      - name: Select the changed-file baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          if git merge-base "$BASE_SHA" HEAD >/dev/null 2>&1; then
            echo "STELLA_CHECK_BASE=$BASE_SHA" >> "$GITHUB_ENV"
          else
            echo "STELLA_CHECK_FULL=1" >> "$GITHUB_ENV"
          fi
      - name: Run the shared quality gate
        run: |
          if [[ "${STELLA_CHECK_FULL:-0}" == "1" ]]; then
            python scripts/quality_check.py full
          else
            make check-legacy
          fi
      - name: Run Stella product agent evals
        run: make eval
      - name: Generate a full audit report on manual request
        if: github.event_name == 'workflow_dispatch'
        run: make audit
      - name: Preserve quality evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stella-quality-report
          path: |
            Alcor/.agents/audits/code-review/Full-Audit-*.md
            Alcor/evals/reports/latest.json
          if-no-files-found: ignore
