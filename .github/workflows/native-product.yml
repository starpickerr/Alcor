name: Native Stella product

on:
  pull_request:
    branches: [develop, main]
    paths: ['package.json', 'package-lock.json', 'packages/**', 'product/**', 'scripts/product/**', 'Makefile', '.github/workflows/native-product.yml']
  push:
    branches: [develop]
    paths: ['package.json', 'package-lock.json', 'packages/**', 'product/**', 'scripts/product/**', 'Makefile', '.github/workflows/native-product.yml']
  workflow_dispatch:

jobs:
  native-product:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install native product dependencies
        run: npm ci --ignore-scripts
      - name: Test native services and migration recovery
        run: npm test
      - name: Build native bundles and reject legacy client inputs
        run: |
          npm run product:pack
          DEVELOPER_DIR="$(xcode-select -p)" npm run product:apple:pack
