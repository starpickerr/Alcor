name: Native Alcor product

on:
  pull_request:
    branches: [develop, main]
    paths: ['package.json', 'package-lock.json', 'packages/**', 'product/**', 'scripts/product/**', 'Makefile', '.github/workflows/**']
  push:
    branches: [develop, main]
    paths: ['package.json', 'package-lock.json', 'packages/**', 'product/**', 'scripts/product/**', 'Makefile', '.github/workflows/**']
  workflow_dispatch:

jobs:
  native-source-connectors:
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        runner: [macos-15, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: Alcor
    steps:
      - uses: actions/checkout@v7
        with:
          path: Alcor
      - name: Read current connector source revisions
        id: sources
        run: |
          python3 - <<'PY'
          import json, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for source in json.load(open('product/source-releases.lock.json'))['sources']:
                  name = source['module'].removesuffix('_mcp')
                  output.write(f'{name}_repository=starpickerr/{source["repo"]}\n')
                  output.write(f'{name}_revision={source["pluginRevision"]}\n')
          PY
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.sources.outputs.elearning_repository }}
          ref: ${{ steps.sources.outputs.elearning_revision }}
          path: dsh-fudan-elearning
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.sources.outputs.email_repository }}
          ref: ${{ steps.sources.outputs.email_revision }}
          path: dsh-email
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: Alcor/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dsh-*/requirements.lock
      - name: Install fixed connector build dependencies
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            npm ci --force --ignore-scripts
            interpreter=Scripts/python.exe
          else
            npm ci --ignore-scripts
            interpreter=bin/python
          fi
          for source in dsh-fudan-elearning dsh-email; do
            python -m venv "../$source/.venv"
            "../$source/.venv/$interpreter" -m pip install --require-hashes -r "../$source/requirements.lock"
            "../$source/.venv/$interpreter" -m pip install PyInstaller==6.22.3
            npm ci --prefix "../$source/plugin" --ignore-scripts
          done
          echo "SOURCE_TEST_PYTHON=../dsh-fudan-elearning/.venv/$interpreter" >> "$GITHUB_ENV"
      - name: Verify pinned sources and package current connectors
        run: npm run product:sources:pack
      - name: Test actual frozen protocols without development paths or real accounts
        run: |
          mkdir -p .local/source-check/@alcor/elearning .local/source-check/@alcor/mail
          for source in elearning mail; do
            archive=$(node -e 'const name=process.argv[1]; const path=name === "mail" ? "dsh-email" : "dsh-fudan-elearning"; const p=require("../"+path+"/plugin/package.json"); console.log("alcor-"+name+"-"+p.version+".tgz")' "$source")
            tar -xzf ".local/artifacts/$archive" --strip-components=1 -C ".local/source-check/@alcor/$source"
          done
          "$SOURCE_TEST_PYTHON" product/tests/source-protocol-check.py .local/source-check
  linux-native-plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Alcor
    steps:
      - uses: actions/checkout@v7
        with:
          path: Alcor
      - name: Read pinned connector revisions
        id: connectors
        shell: bash
        run: |
          node -e 'for (const source of require("./product/source-releases.lock.json").sources) console.log(`${source.module.replace(/_mcp$/, "")}_revision=${source.pluginRevision}`)' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: starpickerr/dsh-email
          ref: ${{ steps.connectors.outputs.email_revision }}
          path: dsh-email
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: starpickerr/dsh-fudan-elearning
          ref: ${{ steps.connectors.outputs.elearning_revision }}
          path: dsh-fudan-elearning
          persist-credentials: false
      - name: Read pinned Apple plugin revision
        id: apple
        shell: bash
        run: |
          echo "revision=$(cat product/apple-sync-revision.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: starpickerr/dsh-apple-sync
          ref: ${{ steps.apple.outputs.revision }}
          path: dsh-apple-sync
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Alcor/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Linux development dependencies
        run: |
          python -m pip install tzdata
          npm ci --force --ignore-scripts
          npm ci --prefix ../dsh-apple-sync --force --ignore-scripts
      - name: Package the shared secretary plugin
        run: npm run product:pack
      - name: Test portable plugin services and authorization boundaries
        run: |
          export ALCOR_BUSINESS_PYTHON="$(command -v python)"
          node --test product/tests/business-python.test.mjs product/tests/business-execution.test.mjs product/tests/alcor-delete-confirmation.test.mjs product/tests/mail-credentials.test.mjs product/tests/elearning-credentials.test.mjs product/tests/host-compatibility.test.mjs product/tests/environments.test.mjs product/tests/shared-business-tools.test.mjs product/tests/alcor-security-policy.test.mjs product/tests/alcor-security-bill-gate.test.mjs product/tests/alcor-organizer-security-boundary.test.mjs product/tests/native-runtime-boundary.test.mjs
  windows-native-plugin:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        working-directory: Alcor
    steps:
      - uses: actions/checkout@v7
        with:
          path: Alcor
      - name: Read pinned connector revisions
        id: connectors
        shell: bash
        run: |
          node -e 'for (const source of require("./product/source-releases.lock.json").sources) console.log(`${source.module.replace(/_mcp$/, "")}_revision=${source.pluginRevision}`)' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: starpickerr/dsh-email
          ref: ${{ steps.connectors.outputs.email_revision }}
          path: dsh-email
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: starpickerr/dsh-fudan-elearning
          ref: ${{ steps.connectors.outputs.elearning_revision }}
          path: dsh-fudan-elearning
          persist-credentials: false
      - name: Read pinned Apple plugin revision
        id: apple
        shell: bash
        run: |
          echo "revision=$(cat product/apple-sync-revision.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: starpickerr/dsh-apple-sync
          ref: ${{ steps.apple.outputs.revision }}
          path: dsh-apple-sync
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Alcor/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Windows development dependencies
        run: |
          python -m pip install tzdata
          # The monorepo also contains required macOS-only development workspaces.
          npm ci --force --ignore-scripts
          npm ci --prefix ../dsh-apple-sync --force --ignore-scripts
      - name: Package the shared secretary plugin
        run: npm run product:pack
      - name: Test native Windows plugin services
        shell: pwsh
        run: |
          $env:ALCOR_BUSINESS_PYTHON = (Get-Command python).Source
          node --test product/tests/business-python.test.mjs product/tests/business-execution.test.mjs product/tests/alcor-delete-confirmation.test.mjs product/tests/mail-credentials.test.mjs product/tests/elearning-credentials.test.mjs product/tests/host-compatibility.test.mjs product/tests/environments.test.mjs product/tests/shared-business-tools.test.mjs product/tests/native-runtime-boundary.test.mjs
      - name: Save the Windows secretary package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secretary-windows-x64
          path: Alcor/.local/artifacts/alcor-secretary-*.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
  native-product:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Alcor
    steps:
      - uses: actions/checkout@v7
        with:
          path: Alcor
      - name: Read pinned connector revisions
        id: connectors
        shell: bash
        run: |
          node -e 'for (const source of require("./product/source-releases.lock.json").sources) console.log(`${source.module.replace(/_mcp$/, "")}_revision=${source.pluginRevision}`)' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: starpickerr/dsh-email
          ref: ${{ steps.connectors.outputs.email_revision }}
          path: dsh-email
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: starpickerr/dsh-fudan-elearning
          ref: ${{ steps.connectors.outputs.elearning_revision }}
          path: dsh-fudan-elearning
          persist-credentials: false
      - name: Read pinned Apple plugin revision
        id: apple
        shell: bash
        run: |
          echo "revision=$(cat product/apple-sync-revision.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: starpickerr/dsh-apple-sync
          ref: ${{ steps.apple.outputs.revision }}
          path: dsh-apple-sync
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: Alcor/package-lock.json
      - name: Install native product dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix ../dsh-apple-sync --ignore-scripts
      - name: Test native services and migration recovery
        run: npm test
      - name: Test package-owned identity and legacy-data compatibility
        run: |
          node --experimental-test-module-mocks --test packages/alcor-privacy/tests/identity-synthetic.test.mjs
      - name: Build the current plugin and reject legacy client inputs
        run: npm run product:pack
      - name: Build the complete native Apple package
        if: github.event_name != 'pull_request'
        run: DEVELOPER_DIR="$(xcode-select -p)" npm run product:apple:pack
      - name: Build and verify the native credential provider in an isolated Keychain
        if: github.event_name != 'pull_request'
        run: |
          npm run product:privacy:pack
          npm run product:privacy:test
      - name: Save the macOS secretary package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secretary-macos
          path: Alcor/.local/artifacts/alcor-secretary-*.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
